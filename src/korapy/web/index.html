<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>korapy dashboard</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header id="topbar">
<span id="brand">korapy</span>
<span id="mode" aria-label="backend mode">starting</span>
<span id="api" aria-label="api version"></span>
<span id="conn" role="status">connecting</span>
<span id="updated" aria-label="last update age"></span>
<button id="token-btn" type="button">token</button>
</header>
<div id="banner" role="alert" hidden></div>
<nav id="tabs" aria-label="views"></nav>
<nav id="chips" aria-label="project filter"></nav>
<main id="view" aria-live="off">
<p id="notice" role="status" hidden></p>
<section id="status-card" aria-label="server status">
<h1>dashboard</h1>
<p id="status-line">loading server details</p>
</section>
<section id="cards" aria-label="fleet status"></section>
<section id="agents" aria-label="agents"></section>
<section id="detail" aria-label="agent detail" hidden>
<p><a id="detail-back" href="#/">back to the overview</a></p>
<div id="detail-fields" aria-label="agent fields"></div>
<div id="tail-controls">
<button id="tail-pause" type="button">tail: pause</button>
<button id="tail-follow" type="button">follow: on</button>
</div>
<pre id="tail" aria-label="agent tail"></pre>
<p id="tail-state" role="status"></p>
</section>
<section id="board" aria-label="board" hidden></section>
<section id="token" aria-label="api token" hidden>
<h2>api token</h2>
<p id="token-help">Paste the API token for this server, then save.</p>
<label for="token-input">token</label>
<input id="token-input" type="password" autocomplete="off" spellcheck="false">
<p id="token-msg" role="status"></p>
<div>
<button id="token-save" type="button">save</button>
<button id="token-forget" type="button">forget this token</button>
</div>
</section>
</main>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
