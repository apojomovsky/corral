[project]
name = "korapy"
version = "0.1.0"
description = "An opinionated core for running fleets of headless coding agents on Linux hosts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "automation", "devops", "github", "systemd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
korapy = "korapy.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F811 is the whole select so `ruff check` evaluates exactly this rule.
# `make lint` (and CI through `make check`) runs it; the suite's
# module-binding guard pins the same property, including duplicates
# hidden in compound-statement bodies.
select = ["F811"]
